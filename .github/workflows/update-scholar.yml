name: Update Scholar Stats

on:
  schedule:
    - cron: '0 6 * * 0'   # Every Sunday at 06:00 UTC
  workflow_dispatch:        # Also runnable manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch and patch Scholar stats
        run: python scripts/update_scholar.py

      - name: Commit and push if changed
        run: |
          git config user.name  "Scholar Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html rakib-website/index.html
          git diff --cached --quiet && echo "Stats unchanged — nothing to commit." || \
            (git commit -m "Auto-update Scholar stats [skip ci]" && git push)
